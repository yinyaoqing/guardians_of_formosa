name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gdunit4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Read Godot version
        id: godot_version
        run: echo "version=$(cat .godot-version)" >> "$GITHUB_OUTPUT"

      - name: Download Godot
        env:
          GODOT_VERSION: ${{ steps.godot_version.outputs.version }}
        run: |
          curl -L -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip godot.zip
          chmod +x "Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          echo "GODOT=$(pwd)/Godot_v${GODOT_VERSION}-stable_linux.x86_64" >> "$GITHUB_ENV"

      - name: Import project
        run: "$GODOT --headless --path . --import || true"

      - name: Run GdUnit4 test suite
        run: "$GODOT --headless --path . -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -a res://tests"
